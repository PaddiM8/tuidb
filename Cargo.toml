[package]
name = "tuidb"
version = "0.1.0"
description = "tuidb"
authors = ["ow-axentia <ow@axentia.se>"]
license = "MIT"
edition = "2024"

[dependencies]
arboard = { version = "3.7.0", features = ["wayland-data-control"] }
color-eyre = "0.6.5"
crossterm = { version = "0.29.0", features = ["event-stream"] }
dirs = "7.0.0"
edtui = { version = "0.11.7", features = ["system-editor"] }
futures = "0.3.34"
gitignore = "1.0.8"
nucleo-matcher = "0.3.1"
ratatui = { version = "0.30.2", features = ["unstable-widget-ref"] }
ratatui-table = "0.2.0"
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.9.0", features = ["sqlite", "postgres", "mysql", "runtime-tokio"] }
thousands = "0.2.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "sync"] }
toml = "1.2.1"
tui-input = "0.15.5"

# Read the optimization guideline for more details: https://ratatui.rs/recipes/apps/release-your-app/#optimizations
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
